name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new push lands. Saves
# CI minutes during force-pushes and rapid PR updates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version picked up from `packageManager` in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  test:
    name: tests (Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: theia
          POSTGRES_PASSWORD: theia
          POSTGRES_DB: theia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U theia -d theia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bootstrap DB (roles + RLS)
        env:
          PGPASSWORD: theia
        run: psql -h localhost -U theia -d theia_test -f infra/00-bootstrap.sql

      - name: Migrate
        env:
          DATABASE_URL: postgres://theia:theia@localhost:5432/theia_test
        run: pnpm --filter @theia/db migrate

      - name: Test
        env:
          DATABASE_URL: postgres://theia:theia@localhost:5432/theia_test
          NODE_ENV: test
        run: pnpm test
